<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Armed With Wings 3</title>
    <meta name="description" content="Ruffle-powered Armed With Wings 3 player for browser and Discord Activity." />
    <style>
      :root {
        color-scheme: dark;
        --text: #f6f7fb;
        --muted: rgba(246, 247, 251, 0.72);
        --panel: rgba(8, 9, 13, 0.72);
        --line: rgba(255, 255, 255, 0.16);
        --ok: #58d68d;
        --warn: #f7c948;
        --bad: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05060a;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #player {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #05060a;
      }

      ruffle-player {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }

      .toolbar {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 24px);
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--warn);
        flex: 0 0 auto;
      }

      .dot.ready {
        background: var(--ok);
      }

      .dot.error {
        background: var(--bad);
      }

      button {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .is-hidden {
        display: none;
      }
    </style>
    <script src="./ruffle-config.js"></script>
    <script src="./vendor/ruffle/ruffle.js"></script>
  </head>
  <body>
    <main id="player" aria-label="Armed With Wings 3 game"></main>
    <div class="toolbar">
      <span class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading</span></span>
      <button id="fullscreenButton" type="button">Fullscreen</button>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
